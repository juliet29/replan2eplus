[project]
name = "plan2eplus"
version = "0.1.6"
description = "Translate floor plan geometry into building energy models"
readme = "README.md"
authors = [
  { name = "Juliet Nwagwu Ume-Ezeoke", email = "jnwagwu@stanford.edu" },
]
requires-python = ">=3.13, <3.14"
dependencies = [
  "cyclopts>=4.4.6",
  "eppy>=0.5.63",
  "expression>=5.6.0",
  "geomeppyupdated>=0.1.0",
  "ladybug-core>=0.44.19",
  "loguru>=0.7.3",
  "matplotlib>=3.10.8",
  "omegaconf>=2.3.0",
  "pipe>=2.2",
  "polars>=1.33.1",
  "pooch>=1.8.2",
  "pre-commit>=4.5.1",
  "ptpython>=3.0.32",
  "pyarrow>=21.0.0",
  "pydantic-settings>=2.11.0",
  "pyprojroot>=0.3.0",
  "pytest-cov>=6.2.1",
  "pytest-skip-slow>=0.0.5",
  "rich>=14.1.0",
  "scipy>=1.16.2",
  "shapely>=2.1.1",
  "tabulate>=0.9.0",
  "tomli-w>=1.2.0",
  "utils4plans",
  "whenever>=0.9.2",
  "xarray>=2025.9.0",
  "xarray-schema>=0.0.3",
]

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["zensical>=0.0.38"]
# utils4plans = { path = "../utils4plans" }
# geomeppyupdated = { path = "../geomeppyupdated", editable = true }
# plyze = { path = "../../../plyze", editable = true }

[tool.uv]
override-dependencies = ["click>=8.1.7"]

[tool.uv.sources]
geomeppyupdated = { path = "../geomeppyupdated", editable = true }

[project.scripts]
p2ep = "plan2eplus.cli.main:main"
p2ep-studies = "plan2eplus.cli.studies:main"
